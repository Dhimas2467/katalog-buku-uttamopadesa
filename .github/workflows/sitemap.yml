name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'daftar-artikel.js'
      - 'daftar-jurnal.js'
      - 'index.html'
      - 'jurnal.html'
      - '*.html'
      - 'sitemap.yml'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Sitemap
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const path = require('path');

          const base = 'https://dhimas2467.github.io/katalog-buku-uttamopadesa/';

          // Menampung halaman HTML.
          const halaman = new Set();

          // Halaman utama.
          halaman.add('index.html');

          // Mengambil halaman artikel dari daftar-artikel.js.
          if (fs.existsSync('daftar-artikel.js')) {
            const source = fs.readFileSync('daftar-artikel.js', 'utf8');

            const daftarArtikel = vm.runInNewContext(
              source + '\ndaftarArtikel'
            );

            if (!Array.isArray(daftarArtikel)) {
              throw new Error('daftarArtikel bukan array yang valid.');
            }

            for (const artikel of daftarArtikel) {
              if (
                artikel &&
                typeof artikel.halaman === 'string' &&
                artikel.halaman.endsWith('.html')
              ) {
                halaman.add(artikel.halaman);
              }
            }
          }

          // Mengambil halaman jurnal dari daftar-jurnal.js.
          halaman.add('jurnal.html');

          if (fs.existsSync('daftar-jurnal.js')) {
            const source = fs.readFileSync('daftar-jurnal.js', 'utf8');

            const daftarJurnal = vm.runInNewContext(
              source + '\nDAFTAR_JURNAL'
            );

            if (!Array.isArray(daftarJurnal)) {
              throw new Error('DAFTAR_JURNAL bukan array yang valid.');
            }

            for (const jurnal of daftarJurnal) {
              if (
                jurnal &&
                typeof jurnal.file === 'string' &&
                jurnal.file.endsWith('.html')
              ) {
                halaman.add(jurnal.file);
              }
            }
          }

          // Memeriksa dan memvalidasi seluruh halaman.
          const halamanValid = [...halaman]
            .filter(file => {
              const lokasi = path.resolve(file);

              // Hanya menerima file HTML di dalam repository.
              if (!file.endsWith('.html')) return false;

              if (!lokasi.startsWith(process.cwd() + path.sep)) {
                console.log(`Path tidak valid, dilewati: ${file}`);
                return false;
              }

              if (!fs.existsSync(lokasi)) {
                console.log(`Halaman belum tersedia, dilewati: ${file}`);
                return false;
              }

              if (!fs.statSync(lokasi).isFile()) {
                console.log(`Bukan file, dilewati: ${file}`);
                return false;
              }

              return true;
            })
            .sort();

          // Membentuk URL sitemap.
          const urls = halamanValid.map(file => {
            const url = base + file
              .split('/')
              .map(segment => encodeURIComponent(segment))
              .join('/');

            return [
              '  <url>',
              `    <loc>${url}</loc>`,
              '  </url>'
            ].join('\n');
          });

          // Membentuk dokumen XML.
          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...urls,
            '</urlset>',
            ''
          ].join('\n');

          // Menyimpan sitemap.xml.
          fs.writeFileSync('sitemap.xml', xml, 'utf8');

          console.log('================================');
          console.log('SITEMAP BERHASIL DIBUAT');
          console.log(`Jumlah halaman: ${halamanValid.length}`);
          console.log('================================');

          halamanValid.forEach(file => {
            console.log(`${base}${file}`);
          });

          NODE

      - name: Validate Sitemap
        run: |
          node <<'NODE'
          const fs = require('fs');

          if (!fs.existsSync('sitemap.xml')) {
            throw new Error('sitemap.xml tidak berhasil dibuat.');
          }

          const xml = fs.readFileSync('sitemap.xml', 'utf8');

          if (!xml.includes('<urlset')) {
            throw new Error('Struktur sitemap XML tidak valid.');
          }

          if (!xml.includes('</urlset>')) {
            throw new Error('Penutup sitemap XML tidak ditemukan.');
          }

          const jumlah = (xml.match(/<url>/g) || []).length;

          if (jumlah === 0) {
            throw new Error('Sitemap tidak memiliki URL.');
          }

          console.log(`Validasi berhasil: ${jumlah} URL ditemukan.`);
          NODE

      - name: Save Sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if ! git diff --cached --quiet; then
            git commit -m "Update sitemap automatically"
            git push
          else
            echo "Tidak ada perubahan sitemap."
          fi
          
