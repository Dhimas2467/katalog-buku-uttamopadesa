name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'daftar-artikel.js'
      - 'index.html'
      - '*.html'
      - '.github/workflows/sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const base = 'https://dhimas2467.github.io/katalog-buku-uttamopadesa/';

          const halaman = new Set(['index.html']);

          // Mengambil halaman katalog dari daftar-artikel.js
          if (fs.existsSync('daftar-artikel.js')) {
            const source = fs.readFileSync('daftar-artikel.js', 'utf8');
            const daftarArtikel = vm.runInNewContext(source + '\ndaftarArtikel');

            if (!Array.isArray(daftarArtikel)) {
              throw new Error('daftarArtikel bukan array yang valid.');
            }

            for (const artikel of daftarArtikel) {
              if (artikel.halaman) {
                halaman.add(artikel.halaman);
              }
            }
          }

          // Menambahkan arsip jurnal dan lima halaman jurnal
          const halamanJurnal = [
            'jurnal.html',
            'sih-ilahi-cakraning-lampah-ilahi.html',
            'nawa-prasanti-batin.html',
            'kesatuan-spiritualitas-keutamaan-hidup.html',
            'proses-pembersihan-rasa.html',
            'cipta-rasa-karsa-tiga-unsur-batin.html'
          ];

          for (const file of halamanJurnal) {
            if (fs.existsSync(file)) {
              halaman.add(file);
            }
          }

          const urls = [...halaman].map(file => {
            return `  <url>\n    <loc>${base + file}</loc>\n  </url>`;
          });

          const xml = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
            ...urls,
            '</urlset>',
            ''
          ].join('\n');

          fs.writeFileSync('sitemap.xml', xml, 'utf8');

          console.log(`Sitemap berhasil dibuat: ${halaman.size} halaman.`);
          NODE

      - name: Save sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update sitemap automatically"
            git push
          fi
